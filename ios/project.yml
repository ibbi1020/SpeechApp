name: SpeechApp
options:
  bundleIdPrefix: com.speechapp
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  SpeechAppKit:
    path: Packages/SpeechAppKit
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 153.0.0
targets:
  SpeechApp:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speechapp.prototype.format1
        PRODUCT_NAME: SpeechApp
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Personal Team (free provisioning) — Ibraheem Farooq
        DEVELOPMENT_TEAM: 45SVH8S72R
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: SpeechAppKit
      - package: WebRTC
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SpeechApp
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "3"
        # Bonjour name of this Mac. Stays valid when the DHCP address changes.
        # Phone and Mac have to be on the same Wi-Fi. Do not put a 192.168 address here.
        CONVERSATION_API_BASE: "http://Ibraheens-MacBook-Air.local:8787"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: SpeechApp connects to your Mac on the local network to start a live conversation.
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: SpeechApp uses the microphone so you can read aloud, talk on a topic, or rehearse with an AI partner. Partner audio is streamed to OpenAI. Reading and topic talks are scored on this device. We do not keep the recording.
        NSSpeechRecognitionUsageDescription: SpeechApp uses on-device speech recognition to follow reading and to time topic talks. Recognition runs on your device.
schemes:
  SpeechApp:
    build:
      targets:
        SpeechApp: all
      preActions:
        - name: Ensure conversation mint
          script: /bin/bash "$SRCROOT/../server/ensure-mint.sh"
          settingsTarget: SpeechApp
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
