name: SpeechApp
options:
  bundleIdPrefix: com.speechapp
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  SpeechAppKit:
    path: Packages/SpeechAppKit
targets:
  SpeechApp:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speechapp.prototype.format1
        PRODUCT_NAME: SpeechApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Personal Team (free provisioning) — Ibraheem Farooq
        DEVELOPMENT_TEAM: 45SVH8S72R
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # iPhone only. XcodeGen's iOS app preset is "1,2"; a universal build with portrait-only
        # orientations is rejected on upload (ITMS-90474, iPad multitasking).
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - package: SpeechAppKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orator
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "4"
        # Standard HTTPS/WSS encryption only (exempt). Skips the TestFlight export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Kept from the WebRTC era (ITMS-90683). Harmless; the app never asks for the camera.
        NSCameraUsageDescription: Orator does not use the camera. Conversations are audio only.
        NSMicrophoneUsageDescription: Orator uses the microphone so you can read aloud, talk on a topic, or rehearse with an AI partner. Reading and topic-talk audio is sent to xAI for transcription. Conversation audio is streamed to xAI for the AI partner. We do not keep the recording.
        NSSpeechRecognitionUsageDescription: Orator uses on-device speech recognition while scoring a conversation. Recognition runs on your device.
schemes:
  SpeechApp:
    build:
      targets:
        SpeechApp: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
