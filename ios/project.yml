name: SpeechApp
options:
  bundleIdPrefix: com.speechapp
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  SpeechAppKit:
    path: Packages/SpeechAppKit
  DSWaveformImage:
    url: https://github.com/dmrschmidt/DSWaveformImage
    from: 14.5.0
  SwiftUI-Flow:
    url: https://github.com/tevelee/SwiftUI-Flow
    from: 3.0.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0
targets:
  SpeechApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Ambient/**"
          - "Resources/ConfettiFalling.lottie"
          - "Resources/ConfettiFalling.license.txt"
          - "XAISecrets.plist"
      - path: App/Resources/Ambient
        buildPhase: resources
      - path: App/Resources/ConfettiFalling.lottie
        buildPhase: resources
      - path: App/Resources/ConfettiFalling.license.txt
        buildPhase: resources
      - path: Shared
      - path: ../font/InstrumentSerif-Regular.ttf
        buildPhase: resources
    settings:
      base:
        # Production bundle id. The Google iOS client's bundle id can be edited
        # until App Check is turned on.
        PRODUCT_BUNDLE_IDENTIFIER: com.speechapp.orator
        PRODUCT_NAME: SpeechApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SpeechApp.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q2Z32YFFGP
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: SpeechAppKit
      - package: DSWaveformImage
        product: DSWaveformImage
      - package: DSWaveformImage
        product: DSWaveformImageViews
      - package: SwiftUI-Flow
        product: Flow
      - package: Lottie
        product: Lottie
      - target: SpeechAppWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orator
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "5"
        # Mint Worker. The xAI key stays on that Worker. Speech and the voice list go here.
        CONVERSATION_API_BASE: "https://orator-mint.ibraheemfrq.workers.dev"
        # Public iOS client id. Not a secret. Edit the bundle id on this same
        # Google client when the app id changes. Leave App Check off.
        GOOGLE_CLIENT_ID: "88161816596-qofcacj2vpkqqtte1cr5944iro9kist8.apps.googleusercontent.com"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Orator can connect to your Mac on the local network for practice limits. Speech is sent to xAI.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.speechapp.conversation
            CFBundleURLSchemes:
              - orator
          - CFBundleURLName: com.speechapp.google
            CFBundleURLSchemes:
              - com.googleusercontent.apps.88161816596-qofcacj2vpkqqtte1cr5944iro9kist8
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: OratorMark
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Orator uses the microphone so you can read aloud, talk on a topic, or rehearse with an AI partner. Speech is sent to xAI for transcription and live conversation. Topic talks can be kept on this phone so you can listen back. You can delete them anytime.
        NSSpeechRecognitionUsageDescription: Orator uses on-device speech recognition to follow reading and to time topic talks. Recognition runs on your device.
  SpeechAppWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        # Production widget id. Same team field as the app.
        PRODUCT_BUNDLE_IDENTIFIER: com.speechapp.orator.widget
        PRODUCT_NAME: SpeechAppWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Q2Z32YFFGP
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - package: SpeechAppKit
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Orator
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  SpeechApp:
    build:
      targets:
        SpeechApp: all
      preActions:
        - name: Ensure conversation mint
          script: /bin/bash "$SRCROOT/../server/ensure-mint.sh"
          settingsTarget: SpeechApp
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
