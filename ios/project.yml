name: SpeechApp
options:
  bundleIdPrefix: com.speechapp
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
packages:
  SpeechAppKit:
    path: Packages/SpeechAppKit
  DSWaveformImage:
    url: https://github.com/dmrschmidt/DSWaveformImage
    from: 14.5.0
  SwiftUI-Flow:
    url: https://github.com/tevelee/SwiftUI-Flow
    from: 3.0.0
targets:
  SpeechApp:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Resources/Ambient/**"
          - "XAISecrets.plist"
      - path: App/Resources/Ambient
        buildPhase: resources
      - path: Shared
      - path: ../font/InstrumentSerif-Regular.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speechapp.prototype.format1
        PRODUCT_NAME: SpeechApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_STYLE: Automatic
        # Personal Team (free provisioning) — Ibraheem Farooq
        DEVELOPMENT_TEAM: 45SVH8S72R
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    postBuildScripts:
      - name: Copy XAI key
        basedOnDependencyAnalysis: false
        script: |
          if [ -f "$SRCROOT/App/XAISecrets.plist" ]; then
            cp "$SRCROOT/App/XAISecrets.plist" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/XAISecrets.plist"
          fi
    dependencies:
      - package: SpeechAppKit
      - package: DSWaveformImage
        product: DSWaveformImage
      - package: DSWaveformImage
        product: DSWaveformImageViews
      - package: SwiftUI-Flow
        product: Flow
      - target: SpeechAppWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orator
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "4"
        # Bonjour name of this Mac. Stays valid when the DHCP address changes.
        # Phone and Mac have to be on the same Wi-Fi. Do not put a 192.168 address here.
        CONVERSATION_API_BASE: "http://Ibraheens-MacBook-Air.local:8787"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Orator can connect to your Mac on the local network for practice limits. Speech is sent to xAI.
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.speechapp.conversation
            CFBundleURLSchemes:
              - orator
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Orator uses the microphone so you can read aloud, talk on a topic, or rehearse with an AI partner. Speech is sent to xAI for transcription and live conversation. Topic talks can be kept on this phone so you can listen back. You can delete them anytime.
        NSSpeechRecognitionUsageDescription: Orator uses on-device speech recognition to follow reading and to time topic talks. Recognition runs on your device.
  SpeechAppWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.speechapp.prototype.format1.widget
        PRODUCT_NAME: SpeechAppWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 45SVH8S72R
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    dependencies:
      - package: SpeechAppKit
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Orator
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  SpeechApp:
    build:
      targets:
        SpeechApp: all
      preActions:
        - name: Ensure conversation mint
          script: /bin/bash "$SRCROOT/../server/ensure-mint.sh"
          settingsTarget: SpeechApp
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
