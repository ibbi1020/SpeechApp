<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body, #root {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.paused #root {
      filter: grayscale(1);
    }
    /* Bundled orb-ui only eases spinner opacity; snap it off when not connecting. */
    html:not([data-orb-state="connecting"]) [data-orb-ui-slot="spinner"] {
      opacity: 0 !important;
      animation: none !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Swift polls this flag. Do not preventDefault — WebKit can restore the canvas.
    window.orbContextLost = false;
    window.addEventListener('webglcontextlost', function () {
      window.orbContextLost = true;
    }, true);
    window.addEventListener('webglcontextrestored', function () {
      window.orbContextLost = false;
    }, true);
  </script>
  <script>
    // Parked off screen (between sessions) the page holds every animation frame so the
    // WebGL loops stop drawing. Swift un-parks on its first signal push.
    (function () {
      var raf = window.requestAnimationFrame.bind(window);
      var caf = window.cancelAnimationFrame.bind(window);
      var held = new Map();
      var nextHeld = -1;
      window.orbParked = true;
      window.requestAnimationFrame = function (cb) {
        if (window.orbParked) { var id = nextHeld--; held.set(id, cb); return id; }
        return raf(cb);
      };
      window.cancelAnimationFrame = function (id) {
        if (id < 0) { held.delete(id); return; }
        caf(id);
      };
      window.orbSetParked = function (parked) {
        parked = !!parked;
        if (window.orbParked === parked) return;
        window.orbParked = parked;
        if (!parked) {
          var pending = Array.from(held.values());
          held.clear();
          pending.forEach(function (cb) { raf(cb); });
        }
      };
    })();
  </script>
  <script src="voice-orb.js"></script>
</body>
</html>
