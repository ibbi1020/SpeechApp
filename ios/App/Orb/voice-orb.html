<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body, #root {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.paused #root {
      filter: grayscale(1);
    }
    /* Bundled orb-ui only eases spinner opacity; snap it off when not connecting. */
    html:not([data-orb-state="connecting"]) [data-orb-ui-slot="spinner"] {
      opacity: 0 !important;
      animation: none !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Swift polls this flag. Do not preventDefault — WebKit can restore the canvas.
    window.orbContextLost = false;
    window.addEventListener('webglcontextlost', function () {
      window.orbContextLost = true;
    }, true);
    window.addEventListener('webglcontextrestored', function () {
      window.orbContextLost = false;
    }, true);
  </script>
  <script src="voice-orb.js"></script>
</body>
</html>
