<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    html, body, #root {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.paused #root {
      filter: grayscale(1);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="voice-orb.js"></script>
</body>
</html>
