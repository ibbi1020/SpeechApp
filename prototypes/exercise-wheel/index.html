<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Exercise wheel — prototype</title>
<style>
  :root {
    --ink: #1a1713;
    --muted: #6a645c;
    --paper: #e8e1d4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header { max-width: 720px; margin: 0 auto; padding: 28px 24px 0; }
  h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.03em; margin: 0 0 8px; }
  .lede { margin: 0; max-width: 62ch; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .lede b { color: var(--ink); font-weight: 600; }

  .stage-wrap { max-width: 420px; margin: 22px auto 12px; padding: 0 24px; }
  .phone {
    width: 100%; max-width: 392px; aspect-ratio: 392 / 806; margin: 0 auto;
    background: #0b0b0c; border-radius: 46px; padding: 11px;
    box-shadow: 0 26px 60px rgba(26,23,19,.22), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .screen {
    position: relative; height: 100%; border-radius: 36px; overflow: hidden;
    background: #000; color: #fff;
  }
  .statusbar {
    position: absolute; top: 14px; left: 28px; right: 28px; z-index: 6;
    display: flex; justify-content: space-between;
    font-size: 12px; font-weight: 600; letter-spacing: -0.01em; opacity: .85;
    pointer-events: none;
  }

  .chrome {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    padding: 54px 24px 28px;
    pointer-events: none;
  }
  .chrome > * { pointer-events: auto; }
  .back {
    width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0;
    color: #fff; cursor: pointer;
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
  }
  .back svg { display: block; margin: 0 auto; }
  .spacer { flex: 1; }
  .go {
    height: 61px; border: 0; border-radius: 999px; cursor: pointer;
    font: 500 17px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    background: #fff; color: #000;
    margin: 0 12px;
  }
  .go:disabled {
    background: rgba(255,255,255,.58); color: rgba(0,0,0,.26); cursor: default;
  }
  .go:not(:disabled):active { transform: scale(.97); }

  .well {
    position: absolute; inset: 0;
    perspective: 1100px;
    touch-action: none;
    cursor: grab;
  }
  .well:active { cursor: grabbing; }
  .well.off { pointer-events: none; }

  .ring {
    position: absolute; left: 50%; top: 50%;
    width: 200px; height: 268px;
    margin-left: -100px; margin-top: -150px;
    transform-style: preserve-3d;
  }
  .card {
    position: absolute; inset: 0;
    border: 0; border-radius: 28px;
    background: #161616; color: #fff;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
    padding: 22px 18px;
    display: flex; align-items: flex-end;
    text-align: left;
    transform-style: preserve-3d;
    backface-visibility: hidden;
    cursor: pointer;
    user-select: none;
  }
  .card .name {
    margin: 0;
    font-size: 26px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05;
  }

  .ghost {
    position: absolute; z-index: 3; overflow: hidden;
    background: #000;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
    pointer-events: none;
  }
  .ghost.gone { display: none; }
  .ghost-inner {
    height: 100%;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 22px 18px 22px;
  }
  .ghost.open .ghost-inner {
    justify-content: flex-start;
    padding: 118px 24px 0;
    transition: padding 420ms ease;
  }
  .kicker {
    margin: 0; color: #fff;
    font-size: 26px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05;
  }
  .ghost.open .kicker {
    font-size: 13px; font-weight: 500; letter-spacing: .06em;
    text-transform: uppercase; color: rgba(255,255,255,.55);
    transition: font-size 420ms ease, letter-spacing 420ms ease, color 420ms ease;
  }
  .line {
    margin: 14px 0 0;
    max-width: 16ch;
    font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05;
    opacity: 0; filter: blur(10px);
  }
  .ghost.open .line {
    opacity: 1; filter: blur(0);
    transition: opacity 280ms ease 160ms, filter 280ms ease 160ms;
  }

  .next {
    position: absolute; inset: 0; z-index: 4;
    padding: 172px 24px 0;
    opacity: 0; filter: blur(18px); pointer-events: none;
  }
  .next.show {
    opacity: 1; filter: blur(0); pointer-events: none;
    transition: opacity 280ms ease, filter 280ms ease;
  }
  .next .kicker {
    font-size: 13px; font-weight: 500; letter-spacing: .06em;
    text-transform: uppercase; color: rgba(255,255,255,.55);
  }
  .next .line {
    opacity: 1; filter: none; margin-top: 14px;
  }

  .readout {
    max-width: 420px; margin: 0 auto 48px; padding: 0 24px;
    color: var(--muted); font-size: 13px; line-height: 1.4;
  }
  .readout b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Exercise wheel</h1>
  <p class="lede">Throwaway prototype. Drag the wheel. Tap a card and it grows until it is the screen. <b>This one</b> confirms, and the ceremony moves to the breath. The back button and the white button never leave.</p>
</header>

<div class="stage-wrap">
  <div class="phone">
    <div class="screen" id="screen">
      <div class="statusbar"><span>9:41</span><span>Prototype</span></div>

      <div class="well" id="well">
        <div class="ring" id="ring"></div>
      </div>

      <div class="ghost gone" id="ghost">
        <div class="ghost-inner">
          <p class="kicker" id="kicker"></p>
          <p class="line" id="line"></p>
        </div>
      </div>

      <div class="next" id="next">
        <p class="kicker" id="next-kicker"></p>
        <p class="line" id="next-line">Follow the circle. It grows as you breathe in.</p>
      </div>

      <div class="chrome">
        <button class="back" id="back" type="button" aria-label="Back">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M11.2 3.6 6 9l5.2 5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="spacer"></div>
        <button class="go" id="go" type="button" disabled>This one</button>
      </div>
    </div>
  </div>
</div>
<p class="readout" id="readout"></p>

<script>
  const exercises = [
    { name: "Reading", line: "Read a passage aloud. Hear every sound." },
    { name: "Monologue", line: "One topic, three takes, less time each." },
    { name: "Conversation", line: "Fifteen minutes with a partner. No script." }
  ];
  const STEP = 360 / exercises.length;

  const screen = document.getElementById("screen");
  const well = document.getElementById("well");
  const ring = document.getElementById("ring");
  const ghost = document.getElementById("ghost");
  const kicker = document.getElementById("kicker");
  const line = document.getElementById("line");
  const next = document.getElementById("next");
  const nextKicker = document.getElementById("next-kicker");
  const go = document.getElementById("go");
  const back = document.getElementById("back");
  const readout = document.getElementById("readout");

  const cards = exercises.map((exercise, i) => {
    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.dataset.i = String(i);
    card.style.transform = "rotateY(" + (i * STEP) + "deg) translateZ(168px)";
    card.innerHTML = '<p class="name">' + exercise.name + "</p>";
    card.setAttribute("aria-label", exercise.name);
    ring.appendChild(card);
    return card;
  });

  let rot = 0;
  let phase = "wheel";
  let chosen = 0;
  let drag = null;

  function norm(a) {
    let x = a % 360;
    if (x > 180) x -= 360;
    if (x < -180) x += 360;
    return x;
  }

  function facing(index) {
    return -index * STEP;
  }

  function nearest(angle) {
    let best = 0;
    let bestD = 1e9;
    for (let i = 0; i < exercises.length; i++) {
      const d = Math.abs(norm(angle - facing(i)));
      if (d < bestD) { bestD = d; best = i; }
    }
    return best;
  }

  function unwrap(current, index) {
    const base = facing(index);
    const turns = Math.round((current - base) / 360);
    return base + turns * 360;
  }

  function paint() {
    ring.style.transform = "rotateY(" + rot + "deg)";
    cards.forEach((card, i) => {
      const ang = Math.abs(norm(rot + i * STEP));
      card.style.opacity = String(1 - ang / 180 * 0.62);
      card.style.zIndex = String(1000 - Math.round(ang));
    });
    const front = nearest(rot);
    const name = exercises[front].name;
    let where = "Wheel. " + name + " is in front.";
    if (phase === "open") where = exercises[chosen].name + " fills the screen. This one will confirm it.";
    if (phase === "onward") where = "Confirmed " + exercises[chosen].name + ". Next is the breath.";
    readout.innerHTML = "<b>" + where + "</b>";
  }

  function setRot(next, animate) {
    rot = next;
    ring.style.transition = animate ? "transform 280ms ease-in-out" : "none";
    paint();
  }

  function showWheel() {
    phase = "wheel";
    well.classList.remove("off");
    ring.style.visibility = "visible";
    ghost.classList.add("gone");
    ghost.classList.remove("open");
    next.classList.remove("show");
    go.disabled = true;
    go.textContent = "This one";
    paint();
  }

  function placeGhost(rect) {
    const host = screen.getBoundingClientRect();
    ghost.style.transition = "none";
    ghost.style.left = (rect.left - host.left) + "px";
    ghost.style.top = (rect.top - host.top) + "px";
    ghost.style.width = rect.width + "px";
    ghost.style.height = rect.height + "px";
    ghost.style.borderRadius = "28px";
  }

  function expand(index) {
    chosen = index;
    phase = "open";
    well.classList.add("off");
    const exercise = exercises[index];
    kicker.textContent = exercise.name;
    line.textContent = exercise.line;
    ghost.style.opacity = "1";
    ghost.style.filter = "none";
    ghost.classList.remove("gone", "open");
    placeGhost(cards[index].getBoundingClientRect());
    go.disabled = true;
    go.textContent = "This one";
    paint();
    requestAnimationFrame(() => {
      ghost.style.transition = "left 420ms ease, top 420ms ease, width 420ms ease, height 420ms ease, border-radius 420ms ease, box-shadow 420ms ease";
      ghost.style.left = "0";
      ghost.style.top = "0";
      ghost.style.width = "100%";
      ghost.style.height = "100%";
      ghost.style.borderRadius = "36px";
      ghost.style.boxShadow = "none";
      ghost.classList.add("open");
      ring.style.visibility = "hidden";
    });
    window.setTimeout(() => {
      if (phase === "open") go.disabled = false;
    }, 420);
  }

  function choose(index) {
    if (phase !== "wheel") return;
    const target = unwrap(rot, index);
    const already = Math.abs(rot - target) < 2;
    if (already) { expand(index); return; }
    phase = "spinning";
    setRot(target, true);
    window.setTimeout(() => {
      if (phase !== "spinning") return;
      phase = "wheel";
      expand(index);
    }, 280);
  }

  function collapse() {
    if (phase !== "open") return;
    phase = "closing";
    go.disabled = true;
    ghost.classList.remove("open");
    const rect = cards[chosen].getBoundingClientRect();
    const host = screen.getBoundingClientRect();
    ghost.style.transition = "left 320ms ease, top 320ms ease, width 320ms ease, height 320ms ease, border-radius 320ms ease";
    ghost.style.left = (rect.left - host.left) + "px";
    ghost.style.top = (rect.top - host.top) + "px";
    ghost.style.width = rect.width + "px";
    ghost.style.height = rect.height + "px";
    ghost.style.borderRadius = "28px";
    window.setTimeout(() => {
      ring.style.visibility = "visible";
      showWheel();
    }, 300);
  }

  function confirm() {
    if (phase !== "open" || go.disabled) return;
    phase = "onward";
    chosen = nearest(rot);
    nextKicker.textContent = exercises[chosen].name;
    ghost.style.transition = "opacity 280ms ease, filter 280ms ease";
    ghost.style.opacity = "0";
    ghost.style.filter = "blur(18px)";
    next.classList.add("show");
    go.disabled = true;
    go.textContent = "Done";
    paint();
  }

  function retreat() {
    if (phase === "open") collapse();
    else if (phase === "onward") {
      ghost.style.opacity = "";
      ghost.style.filter = "";
      showWheel();
    }
  }

  well.addEventListener("pointerdown", (event) => {
    if (phase !== "wheel") return;
    drag = { x: event.clientX, rot: rot, moved: false, id: event.pointerId };
    ring.style.transition = "none";
    well.setPointerCapture(event.pointerId);
  });
  well.addEventListener("pointermove", (event) => {
    if (!drag || drag.id !== event.pointerId) return;
    const dx = event.clientX - drag.x;
    if (Math.abs(dx) > 6) drag.moved = true;
    rot = drag.rot + dx * 0.42;
    paint();
  });
  well.addEventListener("pointerup", (event) => {
    if (!drag || drag.id !== event.pointerId) return;
    const moved = drag.moved;
    drag = null;
    if (!moved) {
      const card = event.target.closest(".card");
      if (card) choose(Number(card.dataset.i));
      return;
    }
    const index = nearest(rot);
    setRot(unwrap(rot, index), true);
  });
  well.addEventListener("pointercancel", () => { drag = null; });

  go.addEventListener("click", confirm);
  back.addEventListener("click", retreat);

  document.addEventListener("keydown", (event) => {
    if (phase !== "wheel") return;
    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
    const front = nearest(rot);
    const nextIndex = event.key === "ArrowRight"
      ? (front + 1) % exercises.length
      : (front + exercises.length - 1) % exercises.length;
    setRot(unwrap(rot, nextIndex), true);
  });

  showWheel();
</script>
</body>
</html>
