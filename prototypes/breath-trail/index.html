<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Breath trail — prototype</title>
<style>
  :root {
    --paper: #e8e1d4;
    --ink: #1a1713;
    --muted: #6a645c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #000;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: absolute; z-index: 2; top: 14px; left: 16px; right: 16px;
    pointer-events: none;
  }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; margin: 0; color: rgba(255,255,255,0.42); }
  .screen {
    position: relative; height: 100vh; overflow: hidden;
    background: #000; color: #fff;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ui {
    position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column;
    padding: 58px 22px 28px; pointer-events: none;
  }
  .heading {
    margin: 0; font-size: 34px; font-weight: 640; letter-spacing: -0.03em; line-height: 1.05;
  }
  .sub { margin: 12px 0 0; max-width: 24ch; font-size: 15px; line-height: 1.35; color: rgba(255, 255, 255, 0.62); }
  .spacer { flex: 1; }
  .cta {
    height: 54px; border-radius: 999px; background: #fff; color: #000;
    display: grid; place-items: center; font-size: 17px; font-weight: 560; letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="screen" id="screen">
  <canvas id="c"></canvas>
  <header>
    <h1>Prototype only. Not in the app.</h1>
  </header>
  <div class="ui">
    <h2 class="heading" id="heading">Breathe in</h2>
    <p class="sub">Follow the circle. It grows as you breathe in.</p>
    <div class="spacer"></div>
    <div class="cta">Done</div>
  </div>
</div>
<script>
"use strict";

const INHALE = 4;
const EXHALE = 6;
const CYCLE = INHALE + EXHALE;
const MAX_SHARE = 1.28;
const REST_SHARE = 0.38;

const screen = document.getElementById("screen");
const canvas = document.getElementById("c");
const trail = document.createElement("canvas");
const ctx = canvas.getContext("2d");
const tctx = trail.getContext("2d");
const heading = document.getElementById("heading");

let viewW = 0;
let viewH = 0;
let frozen = null;

function smoothstep(t) {
  const x = Math.min(1, Math.max(0, t));
  return x * x * (3 - 2 * x);
}

function breathAt(time) {
  const t = ((time % CYCLE) + CYCLE) % CYCLE;
  if (t < INHALE) {
    return { fill: smoothstep(t / INHALE), label: "Breathe in" };
  }
  return { fill: 1 - smoothstep((t - INHALE) / EXHALE), label: "Breathe out" };
}

function radiusFor(fill, height) {
  const diameter = height * MAX_SHARE;
  const scale = REST_SHARE + (1 - REST_SHARE) * fill;
  return (diameter * scale) / 2;
}

function resize() {
  const rect = screen.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewW = rect.width;
  viewH = rect.height;
  canvas.width = Math.round(viewW * dpr);
  canvas.height = Math.round(viewH * dpr);
  trail.width = canvas.width;
  trail.height = canvas.height;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  tctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function strokeArc(target, radius, width, color) {
  const crown = -Math.PI / 2;
  target.lineWidth = width;
  target.strokeStyle = color;
  target.lineCap = "butt";
  target.beginPath();
  target.arc(viewW / 2, viewH, radius, crown - Math.PI / 2, crown + Math.PI / 2, false);
  target.stroke();
}

function paintHalo(radius) {
  ctx.save();
  ctx.filter = "blur(6px)";
  strokeArc(ctx, radius, 6.25, "rgba(255,255,255,0.26)");
  ctx.restore();
}

function paintCore(radius) {
  strokeArc(ctx, radius, 3.5, "rgba(255,255,255,0.52)");
}

// The wake is a copy of the stroke, shifted opposite the motion and
// faded out. Growing (crown rising) shifts it down. Shrinking shifts it up.
function paintTrail(radius, sign, amount) {
  tctx.clearRect(0, 0, viewW, viewH);
  if (amount < 0.05) return;
  strokeArc(tctx, radius, 3.4, "#fff");

  const dir = sign > 0 ? 1 : -1;
  const length = 12 + 16 * amount;
  const steps = 8;
  for (let i = steps; i >= 1; i--) {
    const t = i / steps;
    const fade = Math.pow(1 - t, 1.25);
    const dy = dir * length * t;
    ctx.save();
    ctx.globalAlpha = 0.42 * fade * amount;
    ctx.filter = "blur(" + (1.1 + 5.5 * t).toFixed(2) + "px)";
    ctx.drawImage(trail, 0, dy, viewW, viewH);
    ctx.restore();
  }
}

let lastTime = null;
let prevRadius = null;
let velocity = 0;

function frame(now) {
  const time = now / 1000;
  const dt = lastTime == null ? 1 / 60 : Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  let fill;
  let label;
  let forcedSign = 0;
  if (frozen) {
    fill = frozen.fill;
    label = frozen.label;
    forcedSign = frozen.sign;
  } else {
    const breath = breathAt(time);
    fill = breath.fill;
    label = breath.label;
  }
  if (heading.textContent !== label) heading.textContent = label;

  const radius = radiusFor(fill, viewH);
  if (prevRadius == null) prevRadius = radius;
  const instant = (radius - prevRadius) / Math.max(dt, 1 / 120);
  prevRadius = radius;
  velocity += (instant - velocity) * 0.35;

  const range = radiusFor(1, viewH) - radiusFor(0, viewH);
  const peak = (range * 1.5) / INHALE;
  const amount = frozen
    ? 1
    : Math.min(1, Math.abs(velocity) / peak);
  const sign = forcedSign || (velocity >= 0 ? 1 : -1);

  ctx.clearRect(0, 0, viewW, viewH);
  paintHalo(radius);
  paintTrail(radius, sign, amount);
  paintCore(radius);

  requestAnimationFrame(frame);
}

window.__freezeBreath = function (fill, sign, label) {
  frozen = { fill: fill, sign: sign, label: label || (sign > 0 ? "Breathe in" : "Breathe out") };
};

window.__resumeBreath = function () {
  frozen = null;
  prevRadius = null;
};

resize();
window.addEventListener("resize", resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
