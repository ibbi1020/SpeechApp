# Build Orator (SpeechApp, native SwiftUI + XcodeGen) and upload to TestFlight.
#
# Auth: App Store Connect API key. Signing: manual, Apple Distribution .p12 +
# App Store profile from repo secrets (team Q2Z32YFFGP, bundle com.speechapp.orator).
# See docs/TESTFLIGHT_CI.md.

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional CFBundleVersion override (default: run_number + 3)"
        required: false
        type: string
      changelog:
        description: "Optional TestFlight What to Test notes"
        required: false
        type: string
      skip_upload:
        description: "Build/sign only, do not upload"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - ci/testflight
    paths:
      - "ios/**"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testflight:
    name: Build & upload to TestFlight
    # iOS 26 deployment target + Swift tools 6.2 need Xcode 26.
    runs-on: macos-26
    timeout-minutes: 90

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
      IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_APPSTORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROVISIONING_PROFILE_BASE64 }}
      TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.changelog || '' }}
      SKIP_UPLOAD: ${{ github.event.inputs.skip_upload || contains(github.event.head_commit.message, '[skip upload]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve build number
        env:
          INPUT_BUILD_NUMBER: ${{ github.event.inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            echo "BUILD_NUMBER=$INPUT_BUILD_NUMBER" >> "$GITHUB_ENV"
          else
            echo "BUILD_NUMBER=$(( RUN_NUMBER + 3 ))" >> "$GITHUB_ENV"
          fi

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Setup Ruby / Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Verify required secrets
        run: |
          missing=0
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY \
                      APPLE_TEAM_ID IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_APPSTORE_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Missing required secret: $name"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "BUILD_NUMBER=$BUILD_NUMBER"

      - name: Fastlane -> TestFlight
        working-directory: ios
        run: bundle exec fastlane testflight_release

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orator-ipa-${{ env.BUILD_NUMBER }}
          path: |
            ios/build/*.ipa
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
          retention-days: 7
