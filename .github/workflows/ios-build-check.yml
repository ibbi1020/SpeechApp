# Build-only check (no signing, no TestFlight upload).
name: iOS build check
on:
  workflow_dispatch:
  push:
    branches: [ci/reading-build-check]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: command -v xcodegen || brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build app (iOS device, unsigned)
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project SpeechApp.xcodeproj -scheme SpeechApp -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath DD CODE_SIGNING_ALLOWED=NO \
            > build.log 2>&1 || { grep -E "error:" build.log | head -50; exit 1; }
          grep -E "BUILD SUCCEEDED" build.log
      - name: SpeechAppKit tests (simulator)
        working-directory: ios/Packages/SpeechAppKit
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone 1[6-9]" | grep -oE "[0-9A-F-]{36}")
          xcodebuild test -scheme SpeechAppKit-Package -destination "id=$UDID" 2>&1 \
            | grep -E "error:|✘|✔ Test run|Test run with|TEST (SUCCEEDED|FAILED)|failed" | tail -80
